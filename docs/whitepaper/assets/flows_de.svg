<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 502" width="600" height="502" role="img" aria-label="Zwei Ströme in denselben Bergen"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8878"/></marker></defs><text x="16.0" y="32.0" font-family="Inter" font-size="16" font-weight="600" fill="#1d2027" text-anchor="start">Zwei Ströme in denselben Bergen</text><text x="152.0" y="74.0" font-family="Inter" font-size="13" font-weight="600" fill="#1d2027" text-anchor="middle">Ausbeutung, die die Nachhaltigkeit mäßigt</text><text x="448.0" y="74.0" font-family="Inter" font-size="13" font-weight="600" fill="#1d2027" text-anchor="middle">Regeneration, die Pathways aufbaut</text><rect x="40.0" y="96" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="121.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">Ein Gast kommt für eine Aussicht</text><path d="M152.0 136V158" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="40.0" y="160" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="185.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">Ein Resort verkauft die Aussicht</text><path d="M152.0 200V222" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="40.0" y="224" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="249.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">Das Geld verlässt das Tal</text><path d="M152.0 264V286" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="40.0" y="288" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="313.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">Die Wiese ist Kulisse, ungemäht</text><path d="M152.0 328V350" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="40.0" y="352" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="377.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">Die Hofleute altern und verkaufen</text><rect x="403.0" y="96.0" width="90" height="50" rx="8" fill="none" stroke="#c98a2e" stroke-width="2"/><text x="448.0" y="112.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Wiese gemäht,</text><text x="448.0" y="125.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Handwerk in</text><text x="448.0" y="138.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Gebrauch</text><rect x="487.0" y="191.0" width="90" height="50" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="532.0" y="213.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Wissen bewahrt</text><text x="532.0" y="226.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">durch Tun</text><rect x="461.0" y="296.0" width="90" height="50" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="506.0" y="312.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Gastgebende</text><text x="506.0" y="325.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">bieten Echtes</text><text x="506.0" y="338.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">an</text><rect x="345.0" y="296.0" width="90" height="50" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="390.0" y="312.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Pilgernde</text><text x="390.0" y="325.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">kommen und</text><text x="390.0" y="338.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">lernen</text><rect x="319.0" y="191.0" width="90" height="50" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="364.0" y="207.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Ein Grund und</text><text x="364.0" y="220.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">die Mittel zu</text><text x="364.0" y="233.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">bleiben</text><path d="M478.0 146.0L512.0 191.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M526.0 241.0L522.0 296.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M461.0 321.0L435.0 321.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M374.0 296.0L370.0 241.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M384.0 191.0L418.0 146.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><text x="448.0" y="273.0" font-family="Inter" font-size="11" font-weight="600" fill="#c98a2e" text-anchor="middle">der Ort selbst</text><text x="152.0" y="426.0" font-family="Inter" font-size="11" font-weight="600" fill="#5d5a52" text-anchor="middle">Nettowirkung</text><text x="152.0" y="443.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="middle">Weniger Schaden je Gast; der Trend bleibt</text><text x="448.0" y="426.0" font-family="Inter" font-size="11" font-weight="600" fill="#5d5a52" text-anchor="middle">Nettowirkung</text><text x="448.0" y="443.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="middle">Jeder Besuch stärkt die Fähigkeit des Ortes</text><text x="448.0" y="459.1" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="middle">fortzubestehen</text><line x1="300.0" y1="90" x2="300.0" y2="472" stroke="#e3ddd0" stroke-width="1"/></svg>