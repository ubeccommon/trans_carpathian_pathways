<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 346" width="600" height="346" role="img" aria-label="Wohin jeder Ansatz zielt"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8878"/></marker></defs><text x="16.0" y="32.0" font-family="Inter" font-size="16" font-weight="600" fill="#1d2027" text-anchor="start">Wohin jeder Ansatz zielt</text><line x1="40" y1="150" x2="560" y2="150" stroke="#8f8878" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="300.0" y1="124" x2="300.0" y2="176" stroke="#1d2027" stroke-width="1.5"/><text x="44.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="start">Degeneration</text><text x="44.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="start">Der Ort verliert, was ihn ausmachte:</text><text x="44.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="start">Menschen, Wissen, Wiesen</text><text x="300.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Null</text><text x="300.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Kein Netto-Schaden – das Ziel der</text><text x="300.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Nachhaltigkeit</text><text x="556.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="end">Regeneration</text><text x="556.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="end">Der Ort wird lebendiger und besser</text><text x="556.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="end">imstande fortzubestehen</text><circle cx="133.6" cy="150" r="7" fill="#9a362b"/><text x="133.6" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Resort-Tourismus</text><text x="133.6" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Jedes Jahr weniger Schaden,</text><text x="133.6" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">und mehr davon</text><circle cx="300.0" cy="150" r="7" fill="#8f8878"/><text x="300.0" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Nachhaltiger Tourismus</text><text x="300.0" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Dasselbe Modell, mit</text><text x="300.0" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">geringerem Schaden</text><circle cx="487.2" cy="150" r="7" fill="#c98a2e"/><text x="487.2" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Pathways</text><text x="487.2" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Jeder Besuch stärkt die</text><text x="487.2" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Fähigkeit des Ortes</text><text x="487.2" y="140.8" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">fortzubestehen</text><text x="16.0" y="288.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="start">Nachhaltigkeit fragt, wie weniger Schaden entsteht. Regeneration fragt, was dieser Ort braucht, um</text><text x="16.0" y="304.1" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="start">mehr er selbst zu werden, und baut darauf auf. Das Erste ist eine Obergrenze für Schaden, das Zweite</text><text x="16.0" y="320.2" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="start">eine Richtung.</text></svg>