<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-label="What each approach sees"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8878"/></marker></defs><text x="16.0" y="32.0" font-family="Inter" font-size="16" font-weight="600" fill="#1d2027" text-anchor="start">What each approach sees</text><text x="152.0" y="74.0" font-family="Inter" font-size="13" font-weight="600" fill="#1d2027" text-anchor="middle">Sustainable development</text><text x="448.0" y="74.0" font-family="Inter" font-size="13" font-weight="600" fill="#1d2027" text-anchor="middle">Regeneration</text><circle cx="112.0" cy="188.0" r="58" fill="none" stroke="#8f8878" stroke-width="1.25"/><circle cx="192.0" cy="188.0" r="58" fill="none" stroke="#8f8878" stroke-width="1.25"/><circle cx="152.0" cy="254.0" r="58" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="82.0" y="122.0" font-family="Inter" font-size="12" font-weight="600" fill="#1d2027" text-anchor="middle">Economy</text><text x="222.0" y="122.0" font-family="Inter" font-size="12" font-weight="600" fill="#1d2027" text-anchor="middle">Society</text><text x="152.0" y="328.0" font-family="Inter" font-size="12" font-weight="600" fill="#1d2027" text-anchor="middle">Environment</text><rect x="100.4" y="203.6" width="103.2" height="14.3" fill="#ffffff"/><text x="152.0" y="214.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">a balance to strike</text><circle cx="448.0" cy="210.0" r="118" fill="none" stroke="#5b7a4a" stroke-width="1.5"/><circle cx="448.0" cy="210.0" r="82" fill="none" stroke="#8f8878" stroke-width="1.5"/><circle cx="448.0" cy="210.0" r="46" fill="none" stroke="#c98a2e" stroke-width="1.5"/><rect x="401.7" y="84.6" width="92.6" height="15.6" fill="#ffffff"/><text x="448.0" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5b7a4a" text-anchor="middle">The living land</text><rect x="366.9" y="120.6" width="162.2" height="15.6" fill="#ffffff"/><text x="448.0" y="132.0" font-family="Inter" font-size="12" font-weight="600" fill="#1d2027" text-anchor="middle">The people who live with it</text><text x="448.0" y="214.0" font-family="Inter" font-size="12" font-weight="600" fill="#1d2027" text-anchor="middle">Their economy</text><rect x="381.8" y="285.6" width="132.3" height="14.3" fill="#ffffff"/><text x="448.0" y="296.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">work · knowledge · care</text><text x="152.0" y="360.0" font-family="Inter" font-size="11" font-weight="600" fill="#5d5a52" text-anchor="middle">It measures</text><text x="152.0" y="377.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="middle">Impact reduced, targets met, harm offset</text><text x="448.0" y="360.0" font-family="Inter" font-size="11" font-weight="600" fill="#5d5a52" text-anchor="middle">It measures</text><text x="448.0" y="377.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="middle">The health of the whole, and its capacity to go on</text><line x1="300.0" y1="90" x2="300.0" y2="400" stroke="#e3ddd0" stroke-width="1"/></svg>