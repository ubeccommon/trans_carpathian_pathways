<svg lang="pl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Dokąd zmierza każde podejście"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8878"/></marker></defs><text x="16.0" y="32.0" font-family="Inter" font-size="16" font-weight="600" fill="#1d2027" text-anchor="start">Dokąd zmierza każde podejście</text><line x1="40" y1="150" x2="560" y2="150" stroke="#8f8878" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="300.0" y1="124" x2="300.0" y2="176" stroke="#1d2027" stroke-width="1.5"/><text x="44.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="start">Degeneracja</text><text x="44.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="start">Miejsce traci to, co je tworzyło:</text><text x="44.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="start">ludzi, wiedzę, łąki</text><text x="300.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Zero</text><text x="300.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Brak szkody netto – cel</text><text x="300.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">zrównoważenia</text><text x="556.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="end">Regeneracja</text><text x="556.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="end">Miejsce staje się żywsze i lepiej</text><text x="556.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="end">zdolne trwać</text><circle cx="133.6" cy="150" r="7" fill="#9a362b"/><text x="133.6" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Turystyka kurortowa</text><text x="133.6" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Co roku mniej szkód – i więcej</text><text x="133.6" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">tego samego</text><circle cx="300.0" cy="150" r="7" fill="#8f8878"/><text x="300.0" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Turystyka zrównoważona</text><text x="300.0" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Ten sam model, z mniejszymi</text><text x="300.0" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">szkodami</text><circle cx="487.2" cy="150" r="7" fill="#c98a2e"/><text x="487.2" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Pathways</text><text x="487.2" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Każda wizyta wzmacnia</text><text x="487.2" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">zdolność miejsca do trwania</text><text x="16.0" y="288.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="start">Zrównoważenie pyta, jak szkodzić mniej. Regeneracja pyta, czego to miejsce potrzebuje, by stać się</text><text x="16.0" y="304.1" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="start">bardziej sobą, i od tego zaczyna. Pierwsze to górna granica szkód; drugie to kierunek.</text></svg>