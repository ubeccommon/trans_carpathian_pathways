<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 502" width="600" height="502" role="img" aria-label="Two flows in the same mountains"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8878"/></marker></defs><text x="16.0" y="32.0" font-family="Inter" font-size="16" font-weight="600" fill="#1d2027" text-anchor="start">Two flows in the same mountains</text><text x="152.0" y="74.0" font-family="Inter" font-size="13" font-weight="600" fill="#1d2027" text-anchor="middle">Extraction, which sustainability moderates</text><text x="448.0" y="74.0" font-family="Inter" font-size="13" font-weight="600" fill="#1d2027" text-anchor="middle">Regeneration, which Pathways builds</text><rect x="40.0" y="96" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="121.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">A visitor comes for a view</text><path d="M152.0 136V158" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="40.0" y="160" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="185.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">A resort sells the view</text><path d="M152.0 200V222" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="40.0" y="224" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="249.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">The fee leaves the valley</text><path d="M152.0 264V286" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="40.0" y="288" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="313.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">The meadow is scenery, unmown</text><path d="M152.0 328V350" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="40.0" y="352" width="224" height="40" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="152.0" y="377.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="middle">The holder grows old and sells</text><rect x="403.0" y="96.0" width="90" height="50" rx="8" fill="none" stroke="#c98a2e" stroke-width="2"/><text x="448.0" y="118.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Meadow mown,</text><text x="448.0" y="131.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">craft in use</text><rect x="487.0" y="191.0" width="90" height="50" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="532.0" y="213.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">Knowledge</text><text x="532.0" y="226.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">kept by doing</text><rect x="461.0" y="296.0" width="90" height="50" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="506.0" y="318.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">A host offers</text><text x="506.0" y="331.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">what is real</text><rect x="345.0" y="296.0" width="90" height="50" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="390.0" y="312.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">A traveler</text><text x="390.0" y="325.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">arrives and</text><text x="390.0" y="338.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">learns</text><rect x="319.0" y="191.0" width="90" height="50" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="364.0" y="213.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">A reason and</text><text x="364.0" y="226.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#1d2027" text-anchor="middle">means to stay</text><path d="M478.0 146.0L512.0 191.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M526.0 241.0L522.0 296.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M461.0 321.0L435.0 321.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M374.0 296.0L370.0 241.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M384.0 191.0L418.0 146.0" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><text x="448.0" y="273.0" font-family="Inter" font-size="11" font-weight="600" fill="#c98a2e" text-anchor="middle">the place itself</text><text x="152.0" y="426.0" font-family="Inter" font-size="11" font-weight="600" fill="#5d5a52" text-anchor="middle">Net effect</text><text x="152.0" y="443.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="middle">Less harm per visitor; the trend unchanged</text><text x="448.0" y="426.0" font-family="Inter" font-size="11" font-weight="600" fill="#5d5a52" text-anchor="middle">Net effect</text><text x="448.0" y="443.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="middle">Each visit adds to the place's capacity to</text><text x="448.0" y="459.1" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="middle">continue</text><line x1="300.0" y1="90" x2="300.0" y2="472" stroke="#e3ddd0" stroke-width="1"/></svg>