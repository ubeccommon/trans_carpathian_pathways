<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Куди веде кожен підхід"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8878"/></marker></defs><text x="16.0" y="32.0" font-family="Inter" font-size="16" font-weight="600" fill="#1d2027" text-anchor="start">Куди веде кожен підхід</text><line x1="40" y1="150" x2="560" y2="150" stroke="#8f8878" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="300.0" y1="124" x2="300.0" y2="176" stroke="#1d2027" stroke-width="1.5"/><text x="44.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="start">Занепад</text><text x="44.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="start">Місце втрачає те, що його</text><text x="44.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="start">творило: людей, знання, полонини</text><text x="300.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Нуль</text><text x="300.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Без шкоди в підсумку — мета</text><text x="300.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">сталості</text><text x="556.0" y="198.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="end">Відновлення</text><text x="556.0" y="216.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="end">Місце стає живішим і здатнішим</text><text x="556.0" y="231.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="end">тривати далі</text><circle cx="133.6" cy="150" r="7" fill="#9a362b"/><text x="133.6" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Курортний туризм</text><text x="133.6" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Щороку менше шкоди — і</text><text x="133.6" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">більше туризму</text><circle cx="300.0" cy="150" r="7" fill="#8f8878"/><text x="300.0" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Сталий туризм</text><text x="300.0" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Та сама модель зі зменшеною</text><text x="300.0" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">шкодою</text><circle cx="487.2" cy="150" r="7" fill="#c98a2e"/><text x="487.2" y="92.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="middle">Стежки</text><text x="487.2" y="110.0" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">Кожен приїзд додає місцю</text><text x="487.2" y="125.4" font-family="Inter" font-size="11" font-weight="400" fill="#5d5a52" text-anchor="middle">сили тривати</text><text x="16.0" y="288.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="start">Сталість питає, як завдавати менше шкоди. Регенерація питає, що потрібно цьому місцю, щоб</text><text x="16.0" y="304.1" font-family="Inter" font-size="11.5" font-weight="400" fill="#1d2027" text-anchor="start">стати ще більше собою, і будує від цього. Перше — стеля для шкоди; друге — напрямок.</text></svg>