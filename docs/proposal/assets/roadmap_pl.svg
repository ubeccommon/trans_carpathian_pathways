<svg lang="pl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 538" width="600" height="538" role="img" aria-label="Najpierw korytarz pilotażowy, potem cały łuk Karpat"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8878"/></marker></defs><text x="16.0" y="32.0" font-family="Inter" font-size="16" font-weight="600" fill="#1d2027" text-anchor="start">Najpierw korytarz pilotażowy, potem cały łuk Karpat</text><rect x="16" y="54" width="568" height="132" rx="8" fill="none" stroke="#c98a2e" stroke-width="2"/><text x="32.0" y="84.0" font-family="Inter" font-size="13.5" font-weight="600" fill="#1d2027" text-anchor="start">Faza 1 – Prototyp</text><text x="32.0" y="104.0" font-family="Inter" font-size="12" font-weight="400" fill="#1d2027" text-anchor="start">Korytarz huculski · teraz</text><line x1="248" y1="68" x2="248" y2="172" stroke="#e3ddd0" stroke-width="1"/><circle cx="265" cy="80" r="2.5" fill="#c98a2e"/><text x="275.0" y="84.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#1d2027" text-anchor="start">Znaleźć i połączyć pierwszych gospodarzy</text><circle cx="265" cy="100" r="2.5" fill="#c98a2e"/><text x="275.0" y="104.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#1d2027" text-anchor="start">Narzędzia dla gospodarzy w Plai</text><circle cx="265" cy="120" r="2.5" fill="#c98a2e"/><text x="275.0" y="124.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#1d2027" text-anchor="start">Wyłonić pierwszego kuratora</text><circle cx="265" cy="140" r="2.5" fill="#c98a2e"/><text x="275.0" y="144.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#1d2027" text-anchor="start">Przejść korytarz od początku do końca</text><circle cx="265" cy="160" r="2.5" fill="#c98a2e"/><text x="275.0" y="164.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#1d2027" text-anchor="start">Udokumentować i dopracować</text><line x1="50" y1="186" x2="50" y2="250" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><polygon points="39,218.0 50,207.0 61,218.0 50,229.0" fill="#9a362b"/><text x="72.0" y="215.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="start">Próg: korytarz przebyty i udokumentowany</text><text x="72.0" y="232.0" font-family="Inter" font-size="12" font-weight="400" fill="#5d5a52" text-anchor="start">Faza 2 zaczyna się, gdy pilotaż sprawdzi się w terenie</text><rect x="16" y="250" width="568" height="112" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="32.0" y="280.0" font-family="Inter" font-size="13.5" font-weight="600" fill="#1d2027" text-anchor="start">Faza 2 – Pierwsze rozszerzenie</text><text x="32.0" y="300.0" font-family="Inter" font-size="12" font-weight="400" fill="#5d5a52" text-anchor="start">Ukraińskie Karpaty</text><line x1="248" y1="264" x2="248" y2="348" stroke="#e3ddd0" stroke-width="1"/><circle cx="265" cy="276" r="2.5" fill="#8f8878"/><text x="275.0" y="280.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Kuratorzy w sąsiednich korytarzach</text><circle cx="265" cy="296" r="2.5" fill="#8f8878"/><text x="275.0" y="300.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Planer etapów z danych pilotażu</text><circle cx="265" cy="316" r="2.5" fill="#8f8878"/><text x="275.0" y="320.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Szerszy dostęp dla gospodarzy</text><circle cx="265" cy="336" r="2.5" fill="#8f8878"/><text x="275.0" y="340.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Formularze w językach lokalnych</text><line x1="50" y1="362" x2="50" y2="426" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><polygon points="39,394.0 50,383.0 61,394.0 50,405.0" fill="#9a362b"/><text x="72.0" y="391.0" font-family="Inter" font-size="12.5" font-weight="600" fill="#1d2027" text-anchor="start">Próg: ukraiński łuk ma kuratorów</text><text x="72.0" y="408.0" font-family="Inter" font-size="12" font-weight="400" fill="#5d5a52" text-anchor="start">Faza 3 zaczyna się, gdy znajdą się partnerzy za granicą</text><rect x="16" y="426" width="568" height="92" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="32.0" y="456.0" font-family="Inter" font-size="13.5" font-weight="600" fill="#1d2027" text-anchor="start">Faza 3 – Przez Karpaty</text><text x="32.0" y="476.0" font-family="Inter" font-size="12" font-weight="400" fill="#5d5a52" text-anchor="start">Przez kraje całego łuku</text><line x1="248" y1="440" x2="248" y2="504" stroke="#e3ddd0" stroke-width="1"/><circle cx="265" cy="452" r="2.5" fill="#8f8878"/><text x="275.0" y="456.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Inicjatywy partnerskie w każdym kraju</text><circle cx="265" cy="472" r="2.5" fill="#8f8878"/><text x="275.0" y="476.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Transgraniczna sieć kuratorów</text><circle cx="265" cy="492" r="2.5" fill="#8f8878"/><text x="275.0" y="496.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Jedna ścieżka przez cały łuk</text></svg>