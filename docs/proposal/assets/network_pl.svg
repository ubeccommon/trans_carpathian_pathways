<svg lang="pl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 360" width="632" height="360" role="img" aria-label="Gospodarze tworzą mapę; kurator zamienia ją w podróż"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8878"/></marker></defs><text x="16.0" y="32.0" font-family="Inter" font-size="16" font-weight="600" fill="#1d2027" text-anchor="start">Gospodarze tworzą mapę; kurator zamienia ją w podróż</text><path d="M252 108H380" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M498.0 162V238" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M380 272H252" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M252 302H380" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M134.0 238V162" fill="none" stroke="#8f8878" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="16" y="60" width="236" height="102" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="30.0" y="87.0" font-family="Inter" font-size="14" font-weight="600" fill="#1d2027" text-anchor="start">Gospodarze</text><text x="30.0" y="108.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Sami nanoszą się na mapę</text><text x="30.0" y="126.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Nocleg, jadło, przewodnik, fach</text><text x="30.0" y="144.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Zgoda – pole po polu</text><rect x="380" y="60" width="236" height="102" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="394.0" y="87.0" font-family="Inter" font-size="14" font-weight="600" fill="#1d2027" text-anchor="start">Mapa Plai</text><text x="394.0" y="108.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Gospodarze stają się punktami</text><text x="394.0" y="126.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Ścieżki wytyczone między nimi</text><text x="394.0" y="144.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Sezon, liczba miejsc, dojazd</text><rect x="380" y="238" width="236" height="102" rx="8" fill="none" stroke="#c98a2e" stroke-width="2"/><text x="394.0" y="265.0" font-family="Inter" font-size="14" font-weight="600" fill="#1d2027" text-anchor="start">Kurator szlaku</text><text x="394.0" y="286.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#1d2027" text-anchor="start">Zna teren i ludzi</text><text x="394.0" y="304.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#1d2027" text-anchor="start">Dopracowuje ścieżkę</text><text x="394.0" y="322.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#1d2027" text-anchor="start">Podsuwa, nigdy nie narzuca</text><rect x="16" y="238" width="236" height="84" rx="8" fill="none" stroke="#8f8878" stroke-width="1.25"/><text x="30.0" y="265.0" font-family="Inter" font-size="14" font-weight="600" fill="#1d2027" text-anchor="start">Pielgrzym płaju</text><text x="30.0" y="286.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Czas, towarzystwo, pragnienie</text><text x="30.0" y="304.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">Od popołudnia do miesiąca</text><text x="316.0" y="264.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="middle">podsuwa drogę</text><text x="316.0" y="320.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="middle">pyta</text><text x="146.0" y="204.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#5d5a52" text-anchor="start">idzie, nocuje, je, uczy się</text></s